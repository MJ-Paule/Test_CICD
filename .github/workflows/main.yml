name: CI/CD mit GCC testen

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: +Checkout code from Git
        uses: actions/checkout@v7

      - name: Install tools
        run: sudo apt-get install -y g++ cppcheck clang-tidy

      - name: stylecheck
        run: cppcheck --enable=style,warning,performance --error-exitcode=1 main.cpp

      - name: clang-tidy
        run: clang-tidy main.cpp -checks='bugprone-*, performance-*,readability-*,modernize-*' -- -std=c++17

      - name: Build
        run: g++ main.cpp -o programm -Wall

      - name: Test Konsolen Output
        run: |
          cat <<EOF > expected.txt
          Hello
          Wie stehts
          EOF

          ./program > actual.txt

          diff expected.txt actual.txt
          