name: CI/CD

on:
  workflow_dispatch:
  #push:
  #  branches:
  #    - main

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code from Git
        uses: actions/checkout@v4

      - name: Install tools
        run: sudo apt-get install -y cppcheck clang-tidy

      - name: stylecheck
        run: cppcheck --enable=style,warning,performance --error-exitcode=1 main.cpp

  unittest:
    needs: lint
    runs-on: unbuntu-latest

    steps:
      - name: Checkout code from Git
        uses: actions/checkout@v4

      - name: Install Google Test
        run: sudo apt-get install -y g++ libgtest-dev

      - name: Build unit tests
        run: g++ test_calc.cpp -o unittests -std=c++17 -Wall -lgtest -lgtest_main -pthread && ./unittests


  build-lin:
    needs: unittest
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        compiler: [g++, clang++]
        std: [14, 17, 20]

    name: Build (${{ matrix.compiler }}, C++${{ matrix.std }})

    steps:
      - name: Checkout code from Git
        uses: actions/checkout@v4

      - name: Install compilers
        run: sudo apt-get install -y g++ clang

      - name: Build
        run: ${{ matrix.compiler }} main.cpp -o programm -std=c++${{ matrix.std }} -Wall

      - name: Test
        run: |
          OUTPUT=$(./programm)
          if [ "$OUTPUT" = "Hello" ]; then
            echo "Test bestanden"
          else
            echo "Test fehlgeschlagen: '$OUTPUT'"
            exit 1
          fi

  build-win:
    needs: unittest
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        std: [17, 20]

    name: Build (MSVC, C++${{ matrix.std }})

    steps:
      - name: Checkout code from Git
        uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build
        shell: cmd
        run: |
          cl /EHsc /W4 /WX /std:c++${{ matrix.std }} main.cpp

      - name: Test
        shell: powershell
        run: |
          $output= .\main.exe
          if ($output -eq "Hello")
          {
              Write-Host "Test bestanden"
          }
          else
          {
              Write-Host "Test fehlgeschlagen: '$output'"
              exit 1
          }