name: CI/CD mit GCC testen

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: +Checkout code from Git
        uses: actions/checkout@v7

      - name: Install tools
        run: sudo apt-get install -y g++ cppcheck clang-tidy

      - name: stylecheck
        run: cppcheck --enable=style,warning,performance --error-exitcode=1 main.cpp

      - name: clang-tidy
        run: clang-tidy main.cpp -checks='bugprone-*, performance-*,readability-*,modernize-*' --warnings-as-errors='*' -- -std=c++17

      - name: Build
        run: g++ main.cpp -o programm -Wall

      - name: Test Konsolen Output
        run: |
          OUTPUT=$(./programm)
          if [ "$OUTPUT" = "Hello" ]; then
            echo "Test bestanden bro"
          else
            echo "Da lief etwas schief: 'OUTPUT'"
            exit 1
          fi
